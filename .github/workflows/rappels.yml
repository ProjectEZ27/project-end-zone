name: Rappels automatiques

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  appeler-rappels:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la route des rappels
        run: |
          curl -X GET "https://projectendzone.fr/api/cron/rappels" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"