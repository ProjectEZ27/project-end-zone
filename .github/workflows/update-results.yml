name: Mise à jour des résultats NFL

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la route de mise à jour
        run: 'curl -f -X GET "https://projectendzone.fr/api/cron/update-results" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"'